<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Boardy the cardboard box blinking next to the text: Hey, I'm Nathen. Software engineer at Boardy, the AI superconnector.">
  <style>
    .serif { font-family: Newsreader, Georgia, 'Times New Roman', serif; }
    .sans { font-family: 'Bricolage Grotesque', -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .bob { animation: bob 3.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .shadow { transform-box: fill-box; transform-origin: center; animation: shadow 3.6s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.8s infinite; }
    .wave { transform-box: fill-box; transform-origin: 70% 80%; animation: wave 3s ease-in-out infinite; }
    .b1 { transform-box: fill-box; transform-origin: bottom right; animation: b1 10s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
    .typing { opacity: 0; animation: typing 10s linear infinite; }
    .dot { animation: dot 1s ease-in-out infinite; }
    .dot:nth-child(3) { animation-delay: 0.15s; }
    .dot:nth-child(4) { animation-delay: 0.3s; }
    .b2 { transform-box: fill-box; transform-origin: bottom left; animation: b2 10s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
    .pill { animation: pill 10s cubic-bezier(0.23, 1, 0.32, 1) infinite; }

    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 0.18; } 50% { transform: scaleX(0.86); opacity: 0.11; } }
    @keyframes blink { 0%, 90%, 96%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.1); } }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); }
      30% { transform: rotate(14deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(10deg); }
    }
    @keyframes b1 {
      0%, 5% { opacity: 0; transform: translateY(10px) scale(0.92); }
      11%, 90% { opacity: 1; transform: none; }
      96%, 100% { opacity: 0; transform: none; }
    }
    @keyframes typing { 0%, 15% { opacity: 0; } 17%, 31% { opacity: 1; } 32%, 100% { opacity: 0; } }
    @keyframes dot { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    @keyframes b2 {
      0%, 31% { opacity: 0; transform: translateY(10px) scale(0.92); }
      37%, 90% { opacity: 1; transform: none; }
      96%, 100% { opacity: 0; transform: none; }
    }
    @keyframes pill {
      0%, 50% { opacity: 0; transform: translateY(8px); }
      56%, 90% { opacity: 1; transform: none; }
      96%, 100% { opacity: 0; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <pattern id="corrugation" width="7" height="10" patternUnits="userSpaceOnUse">
      <rect width="1.4" height="10" fill="#7a4d22" opacity="0.09"/>
    </pattern>
    <g id="box">
      <polygon points="0,20 40,0 190,0 150,20" fill="#e7bb82"/>
      <polygon points="150,20 190,0 190,135 150,160" fill="#b88350"/>
      <polygon points="150,20 190,0 190,135 150,160" fill="url(#corrugation)"/>
      <polygon points="171,13 183,7 183,44 171,50" fill="#d6b58c" opacity="0.85"/>
      <rect x="0" y="20" width="150" height="140" fill="#d9a56a"/>
      <rect x="0" y="20" width="150" height="140" fill="url(#corrugation)"/>
      <polygon points="0,160 150,160 162,188 -22,188" fill="#cf9860"/>
      <polygon points="0,160 150,160 162,188 -22,188" fill="url(#corrugation)"/>
      <polygon points="150,160 190,135 224,158 162,188" fill="#a8733f"/>
    </g>
  </defs>

  <rect x="1" y="1" width="998" height="338" rx="28" fill="#f5f2eb" stroke="#e6dfd1" stroke-width="2"/>

  <ellipse class="shadow" cx="196" cy="292" rx="112" ry="10" fill="#1a1715"/>
  <g class="bob">
    <g transform="translate(96 76)">
      <use href="#box"/>
      <circle class="eye" cx="48" cy="72" r="11" fill="#1d3a5c"/>
      <circle class="eye" cx="104" cy="72" r="11" fill="#1d3a5c"/>
      <path d="M44 110 Q76 134 108 110" fill="none" stroke="#1d3a5c" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>

  <text class="serif" x="360" y="100" font-size="52" font-weight="500" letter-spacing="-1" fill="#1a1715">Hey, I'm Nathen</text>
  <text class="wave" x="748" y="98" font-size="44">👋</text>
  <text class="sans" x="362" y="136" font-size="19" fill="#655f58">Software engineer at Boardy, the AI superconnector</text>

  <g class="b1">
    <rect x="570" y="162" width="390" height="42" rx="21" fill="#34c759"/>
    <text class="sans" x="765" y="189" font-size="17" fill="#ffffff" text-anchor="middle">I'm hiring a founding engineer. Any ideas?</text>
  </g>

  <g class="typing">
    <rect x="360" y="218" width="76" height="42" rx="21" fill="#e9e4da"/>
    <circle class="dot" cx="382" cy="239" r="5" fill="#8e877d"/>
    <circle class="dot" cx="398" cy="239" r="5" fill="#8e877d"/>
    <circle class="dot" cx="414" cy="239" r="5" fill="#8e877d"/>
  </g>

  <g class="b2">
    <rect x="360" y="218" width="360" height="42" rx="21" fill="#e9e4da"/>
    <text class="sans" x="540" y="245" font-size="17" fill="#1a1715" text-anchor="middle">I know just the person. Want an intro?</text>
  </g>

  <g class="pill">
    <rect x="361" y="277" width="138" height="32" rx="16" fill="none" stroke="#176f35" stroke-width="1.5"/>
    <text class="sans" x="430" y="298" font-size="15" font-weight="600" fill="#176f35" text-anchor="middle">✓ Intro made</text>
  </g>
</svg>
